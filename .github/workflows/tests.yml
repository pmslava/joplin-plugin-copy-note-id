name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast gate: type-check and build the plugin. Copy Note ID has no test suite of its own, so the
  # checks are `tsc --noEmit` plus a full `npm run dist` that must actually emit the .jpl. This is the
  # job the publish workflow gates on.
  build:
    name: Type-check & build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm ci` runs the `prepare` script, which itself runs `npm run dist` (and webpack's
      # validateScreenshots over the manifest). Install with scripts, then type-check and rebuild
      # explicitly so a build/type break fails here loudly and fast.
      - run: npm ci
      # Version-consistency harness: pin the "quadruple" the publishing playbook requires. The bump
      # helper (`npm run updateVersion`) only touches package.json + src/manifest.json, so the
      # package-lock.json version fields drift silently unless the lockfile is refreshed. Fail the
      # build here — before publishing can ever gate on it — unless all four agree.
      - name: Check the version is pinned across all four places
        run: |
          node -e '
            const pkg = require("./package.json").version;
            const manifest = require("./src/manifest.json").version;
            const lock = require("./package-lock.json");
            const places = {
              "package.json": pkg,
              "src/manifest.json": manifest,
              "package-lock.json .version": lock.version,
              "package-lock.json .packages[\"\"].version": lock.packages[""].version,
            };
            const values = Object.values(places);
            if (new Set(values).size !== 1) {
              console.error("::error::Version mismatch across the four version places: " + JSON.stringify(places));
              process.exit(1);
            }
            console.log("Version is consistent at " + pkg + " across all four version places.");
          '
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build the plugin
        run: npm run dist
      - name: Check the build produced the .jpl
        run: |
          PLUGIN_ID="$(node -p "require('./src/manifest.json').id")"
          for FILE in "publish/$PLUGIN_ID.jpl" "publish/$PLUGIN_ID.json"; do
            if [ ! -s "$FILE" ]; then
              echo "::error::Expected $FILE to exist and be non-empty after npm run dist"
              exit 1
            fi
          done
          echo "Built publish/$PLUGIN_ID.jpl"
