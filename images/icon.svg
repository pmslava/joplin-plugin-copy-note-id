<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c7cfa"/>
      <stop offset="1" stop-color="#3b5bdb"/>
    </linearGradient>
  </defs>
  <!-- app-tile background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- back card: the "copy" metaphor -->
  <rect x="30" y="28" width="46" height="58" rx="8" fill="#ffffff" opacity="0.4"/>
  <!-- front card: the note -->
  <rect x="50" y="42" width="48" height="62" rx="9" fill="#ffffff"/>
  <!-- hash mark: the "ID" -->
  <g stroke="#3b5bdb" stroke-width="5" stroke-linecap="round">
    <line x1="68" y1="58" x2="68" y2="88"/>
    <line x1="80" y1="58" x2="80" y2="88"/>
    <line x1="59" y1="66" x2="89" y2="66"/>
    <line x1="59" y1="80" x2="89" y2="80"/>
  </g>
</svg>
